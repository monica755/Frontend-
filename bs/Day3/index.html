<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">My Website</a>

        <div>
            <a class="text-white me-3" href="#">Home</a>
            <a class="text-white me-3" href="#">About</a>
            <a class="text-white" href="#">Contact</a>
        </div>
    </div>
</nav>

<div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/images/3.png" class="d-block w-100" alt="img_1">
    </div>
    <div class="carousel-item">
      <img src="assets/images/1.png" class="d-block w-100" alt="img_2">
    </div>
    <div class="carousel-item">
      <img src="assets/images/2.png" class="d-block w-100" alt="img_3">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
<!-- Cards -->
<div class="container my-4">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                
                <div class="card-body">
                    <h5>Web Design</h5>
                    <p>Learn HTML and CSS.</p>
                    <button class="btn btn-primary">Learn</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                
                <div class="card-body">
                    <h5>JavaScript</h5>
                    <p>Learn JavaScript.</p>
                    <button class="btn btn-success">Learn</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>


</body>
</html>
