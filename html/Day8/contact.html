<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form>

        <label>Full Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>

        <label>Subject:</label><br>
        <input type="text" name="subject" placeholder="Enter subject"><br><br>

        <label>Message:</label><br>
        <textarea name="message" rows="5" cols="30" placeholder="Enter your message"></textarea><br><br>

        <input type="submit" value="Send">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
