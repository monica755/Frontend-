<!DOCTYPE html>
<html>
<head>
    <title>Electronics Shop Inventory System</title>
</head>
<body>
    <center>

<h2>Product Registration</h2>

<form>
    Product ID:<br>
    <input type="text"><br><br>

    Product Name:<br>
    <input type="text"><br><br>

    Brand:<br>
    <input type="text"><br><br>

    Category:<br>
    <select>
        <option>Mobile</option>
        <option>Laptop</option>
        <option>TV</option>
        <option>Accessories</option>
    </select><br><br>

    Price:<br>
    <input type="number"><br><br>

    Quantity:<br>
    <input type="number"><br><br>

    Supplier:<br>
    <input type="text"><br><br>

    Product Image:<br>
    <input type="file"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>

<br>

<table border="2">
    <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Brand</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Stock Status</th>
    </tr>

    <tr>
        <td>P101</td>
        <td>Smartphone</td>
        <td>Samsung</td>
        <td>20000</td>
        <td>15</td>
        <td>Available</td>
    </tr>
</table>

</body>
</center>
</html>
