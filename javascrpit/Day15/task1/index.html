<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-15 Show and Hide the content</title>
    <style>
        #para {
            opacity: 0;
            transition: 0.5s;
        }

        #para.show {
            max-height: 100px;
            opacity: 1;
        }

        
    </style>
</head>
<body>
    <p id="para">
        This is the paragraph.Now you can show and hide me!
    </p>

    <button id="btn">Show / Hide</button>
    <script src="assets/js/index.js"></script>
</body>
</html>
