<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Departments</title>

    <style>
        
        .dept{
            width: 250px;
            height: 60px;
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .cse{
            background-color: blue;
        }

        .it{
            background-color: green;
        }

        .ece{
            background-color: orange;
        }

        .eee{
            background-color: purple;
        }

        .mech{
            background-color: brown;
        }
    </style>
</head>
<body>

    <h1>Engineering Departments</h1>

    <div class="dept cse">CSE</div>
    <div class="dept it">IT</div>
    <div class="dept ece">ECE</div>
    <div class="dept eee">EEE</div>
    <div class="dept mech">Mechanical</div>

</body>
</html>
