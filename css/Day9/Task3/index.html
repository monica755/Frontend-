<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>
<link rel="stylesheet" href="assests/css/style.css">
    
</head>

<body>

    <h1>Products</h1>

    <div class="container">

        <div class="card">
            <img src="assests/css/images/laptop.jfif" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹50,000</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assests/css/images/keyboard.jfif" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assests/css/images/mouse.jfif" alt="Mouse">
            <h2>Mouse</h2>
            <p>₹800</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assests/css/images/airpods.jfif" alt="AirPods">
            <h2>AirPods</h2>
            <p>₹3,000</p>
            <button>Buy</button>
        </div>

    </div>

</body>
</html>
